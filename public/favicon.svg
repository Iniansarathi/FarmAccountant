<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <circle cx="256" cy="256" r="240" fill="#0C9D61"/>
  <!-- Ledger Bars -->
  <rect x="130" y="270" width="48" height="120" rx="12" fill="#FFFFFF"/>
  <rect x="198" y="200" width="48" height="190" rx="12" fill="#FFFFFF"/>
  <rect x="266" y="150" width="48" height="240" rx="12" fill="#FFFFFF"/>
  
  <!-- Sprout Stem (sweeps up and curves left) -->
  <path d="M 290 150 C 290 90, 230 90, 230 90" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" fill="none"/>
  
  <!-- Left Leaf (curves left and slightly upwards) -->
